[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairon"
version = "0.1.0"
description = "Kairon — Knowledge & Research Operating Stack: ontology, research, MCP ecosystem"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Workspace Team"},
]
maintainers = [
    {name = "starlink-awaken"},
]
keywords = ["knowledge-engineering", "MCP", "research", "ontology", "agent", "LLM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
readme = "README.md"
dependencies = [
    "socksio>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/starlink-awaken/omostation"
Repository = "https://github.com/starlink-awaken/kairon"
Documentation = "https://github.com/starlink-awaken/kairon/tree/main/docs"
Changelog = "https://github.com/starlink-awaken/kairon/blob/main/CHANGELOG.md"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
core-models = { workspace = true }
codeanalyze = { workspace = true }
kronos = { workspace = true }
eidos = { workspace = true }
minerva = { workspace = true }
agora = { workspace = true }
sophia = { workspace = true }
ontoderive = { workspace = true }
forge = { workspace = true }
kos = { workspace = true }
iris = { workspace = true }
ssot-kernel = { workspace = true }
agent-runtime = { workspace = true }
wksp = { workspace = true }
ecos = { workspace = true }
cron-service = { workspace = true }
kairon-governance = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
minversion = "7.0"
addopts = "-v --tb=short -q"

[tool.coverage.run]
source = ["packages"]
omit = ["packages/*/tests/*"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "PLE", "RUF100"]
ignore = ["S101", "S603", "S607", "S108", "S110", "S314", "S608", "E402", "E501", "SIM115", "N813", "UP047"]

[tool.ruff.format]
quote-style = "double"


[tool.hatch.build.targets.wheel]
packages = ["src/kairon"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]
