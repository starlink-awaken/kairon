[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaironcloud-billing"
version = "0.1.0"
description = "Billing subsystem extracted from SharedBrain D_Cloud — models, pricing, usage tracking, Stripe integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
]

[project.optional-dependencies]
stripe = ["stripe>=6.0"]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kaironcloud_billing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
