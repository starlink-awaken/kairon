[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharedbrain-standalone"
version = "0.1.0"
description = "Standalone HTTP/MCP server wrapping sharedbrain-core as a deployable service"
requires-python = ">=3.10"
dependencies = [
    "core-models",
    "fastapi",
    "fastmcp",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
