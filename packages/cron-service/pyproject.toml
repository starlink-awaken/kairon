[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cron-service"
version = "1.0.0"
description = "Cron scheduler service — scripts as SSOT, MCP for Hermes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "fastmcp>=0.1",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "croniter>=6.2.2",
    "pyyaml>=6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cron_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[project.scripts]
cron-service = "cron_service.server:main"
