[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-lib"
version = "0.4.0"
description = "Shared library for kairon monorepo"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairon_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
