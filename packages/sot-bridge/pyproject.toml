[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sot-bridge"
version = "0.1.0"
description = "sot-bridge — 单源真相 (SSOT) + 跨系统桥接 (SharedBrain Bridge)。合并自 ssot-kernel + sharedbrain-bridge (P31-W1 ADR-0006)。"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "运营生态组"}]
keywords = ["ssot", "knowledge-engineering", "ontology", "sharedbrain-bridge", "bridge"]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "core-models",
    "fastapi",
    "fastmcp",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6.0"]
standalone = ["uvicorn"]

[project.scripts]
sot-bridge = "sot_bridge.cli:main"
ssot-kernel = "sot_bridge.ssot_kernel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sot_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
