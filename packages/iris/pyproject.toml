[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris"
version = "0.1.0"
description = "Connector hub for personal knowledge platforms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "xiamingxing"}]
keywords = ["connector", "knowledge", "note", "sync", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastmcp>=0.4",
]

[project.optional-dependencies]
ssot = ["ssot-kernel"]
dev = ["pytest>=7.0", "ruff>=0.6.0"]

[project.scripts]
iris = "iris.cli:main"
iris-mcp = "iris.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
