[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharedbrain-bridge"
version = "0.2.0"
description = "Bridge between kairon and SharedBrain — EU pricing, immune audit, batch sync, standalone server"
requires-python = ">=3.10"
dependencies = [
    "core-models",
    "fastapi",
    "fastmcp",
    "httpx",
]

[project.optional-dependencies]
standalone = [
    "uvicorn",
]

[project.scripts]
sb-bridge = "sharedbrain_bridge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
