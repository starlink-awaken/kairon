[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairon-lib-events"
version = "0.4.0"
description = "Shared event data model for kairon event bus systems — extracted from shared-lib"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["event-bus", "events", "kairon", "shared-lib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairon_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
