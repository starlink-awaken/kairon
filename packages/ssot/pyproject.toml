[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssot-kernel"
version = "1.0.0"
description = "SSOT — 领域知识单一事实源（Domain Knowledge Single Source of Truth）"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "运营生态组"}]
keywords = ["ssot", "knowledge-engineering", "ontology"]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ssot_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
