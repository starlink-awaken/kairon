[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-engine"
version = "0.1.0"
description = "GC Engine — garbage collection, memory excretion, distillation"
readme = ""
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Workspace Team"}
]
keywords = ["garbage-collection", "memory", "excretion", "distillation", "retention"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/gc_engine"]

[tool.ruff.lint]
# datetime.UTC is Python 3.11+; target >=3.10 requires timezone.utc
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
