[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wksp"
version = "0.3.0"
description = "Workspace — 统一用户入口：研究对象管理系统"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "夏铭星"}]
keywords = ["research", "workspace", "knowledge-management", "cli"]

dependencies = ["click>=8.0", "rich>=13.0"]

[project.scripts]
workspace = "wksp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wksp"]

[tool.pytest.ini_options]
testpaths = ["src/wksp/tests"]
pythonpath = ["src"]
