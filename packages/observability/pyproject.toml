[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observability"
version = "0.1.0"
description = "Observability — SLO tracking, alerting, metrics, health checks"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Workspace Team"}
]
keywords = ["observability", "slo", "metrics", "alerting", "health"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[tool.ruff.lint]
# datetime.UTC is Python 3.11+; target >=3.10 requires timezone.utc
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
