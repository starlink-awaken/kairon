[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Agent Hub — agent registration, discovery, and lifecycle management"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
