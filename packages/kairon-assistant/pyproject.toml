[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairon-assistant"
version = "1.0.0"
description = "Smart Assistant — command parsing, context management, and session management extracted from SharedBrain D_Intelligence"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kairon Contributors"}]
keywords = ["assistant", "command-parser", "context", "session", "nlp"]

dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairon_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.1.0",
]

