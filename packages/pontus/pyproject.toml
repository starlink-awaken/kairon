[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pontus"
version = "0.1.0"
description = "Pontus — Knowledge Pipeline Engine: DSL, DAG scheduler, checkpointing, and data quality"
readme = ""
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pontus Contributors"}]
keywords = ["pipeline", "dag", "knowledge", "etl"]

dependencies = [
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pontus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
