[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engine-core"
version = "0.3.0"
description = "Engine core utilities extracted from SharedBrain D_Execution: event bus, task store, retry policy, capability catalog, command dispatch, domain router, task DAG"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["engine", "event-bus", "task-store", "retry", "dispatch", "dag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "kairon-lib-events",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engine_core"]
