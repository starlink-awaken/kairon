[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidos"
version = "0.1.0"
description = "Schema definition and validation layer for the Workspace knowledge foundation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Workspace Team"}
]
keywords = ["schema", "validation", "knowledge", "ontology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "core-models",
]

[project.scripts]
eidos = "eidos.cli:main"
eidos-mcp = "eidos.mcp_server:main"
eidos-agent = "eidos.agent:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/eidos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

