[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symphony-protocol"
version = "0.1.0"
description = "Symphony Protocol — 形式化执行阶段协议（状态机 + Agent匹配 + 触发器引擎）"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["state-machine", "agent-matching", "trigger-engine", "symphony-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/symphony_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
