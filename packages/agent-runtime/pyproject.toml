[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.5.0"
description = "Agent Runtime engine — CLI, MCP & FastAPI entry points"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = ["fastapi>=0.110", "fastmcp>=0.1", "httpx>=0.27"]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
