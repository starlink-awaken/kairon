[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway-kernel"
version = "0.1.0"
description = "llm-gateway-kernel — LLM 抽象 + 引擎核心 (llm-gateway + engine-core 合并)"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["llm", "gateway", "engine", "event-bus", "task-store", "dispatch", "provider", "openai", "anthropic", "gemini", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "core-models",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.0",
    "kairon-lib-events",
    "requests>=2.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
gemini = ["google-generativeai>=0.6"]

[project.scripts]
llm-gateway-kernel = "llm_gateway_kernel.llm_gateway.cli:main"
llm-gateway-kernel-mcp = "llm_gateway_kernel.llm_gateway.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "7.0"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "PLE", "RUF"]
ignore = ["S101", "E501", "E402"]
