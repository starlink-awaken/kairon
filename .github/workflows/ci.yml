name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    continue-on-error: true # 存量全仓 lint debt 只作可见性信号；专项门禁见 kems-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check packages/
      - name: Type check
        run: uv run mypy packages/
      - name: Contract Gatekeeper
        run: python scripts/contract_gatekeeper.py packages/

  test-codeanalyze:
    continue-on-error: true # 独立仓历史依赖/pytest 基线，不阻断无关增量
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # P82-S1收尾: 根 pyproject requires-python>=3.13, 根 uv sync 在 3.10-3.12 必挂;
        # test-codeanalyze 虽跑 packages/codeanalyze/tests (子包>=3.10) 但 install 步骤
        # 用根 uv sync, 故矩阵只留 3.13. 子包跨版本兼容由子包自身 CI 保证.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest packages/codeanalyze/tests/ -x -q

  test-all:
    continue-on-error: true # 存量跨包测试与路径假设保持可见，不冒充本轮回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Run all package tests
        run: make test-fast
      - name: Coverage report (informational, no fail_under gate)
        # pyproject.toml declares fail_under=70 but actual ~19% (post-2026-07-26 4 PR
        # cleanup of 70 0-ref modules). Coverage reporting is informational until
        # incremental test additions push the ratio up. Do NOT add --cov-fail-under
        # to avoid breaking the build before targets are met.
        run: uv run pytest --cov=packages --cov-report=term-missing --no-header -q packages/ 2>&1 | tail -50 || true

  kems-quality:
    name: KEMS OCR quality contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run KEMS OCR tests
        run: |
          PYTHONPATH=packages/kos/src uv run --no-project --with pytest pytest \
            packages/kos/tests/test_kems_quality.py \
            packages/kos/tests/test_kems_ocr_quality_store.py -q
      - name: Lint KEMS OCR files
        run: |
          uv run --no-project --with ruff ruff check \
            packages/kos/src/kos/kems/ocr_quality.py \
            packages/kos/src/kos/kems/ocr_quality_store.py \
            packages/kos/tests/test_kems_quality.py \
            packages/kos/tests/test_kems_ocr_quality_store.py
